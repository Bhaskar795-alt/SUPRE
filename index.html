<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GETO // TELEGRAM SYSTEM</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
    --neon: #a000ff; --neon2: #ff006e; --green: #00ff9d;
    --cyan: #00e5ff; --bg: #05000a; --text: #d4d4e8;
    --mono: 'Share Tech Mono', monospace; --head: 'Orbitron', sans-serif;
}
body {
    background: var(--bg); color: var(--text);
    font-family: var(--mono); min-height: 100vh;
    overflow-x: hidden; padding: 15px;
}
#matrix-canvas {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: -2; opacity: 0.3;
}
.scanlines-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 999;
    background: repeating-linear-gradient(0deg,
        rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px,
        transparent 1px, transparent 3px);
    opacity: 0.35;
}
.app-container { max-width: 1200px; margin: 0 auto; }
.topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 15px 20px; margin-bottom: 25px;
    background: rgba(10,0,21,0.75); backdrop-filter: blur(10px);
    border: 1px solid rgba(160,0,255,0.3); border-radius: 12px;
    box-shadow: 0 0 30px rgba(160,0,255,0.2);
    flex-wrap: wrap; gap: 10px;
}
.logo { display: flex; align-items: center; gap: 10px; }
.glitch {
    font-family: var(--head); font-weight: 900; font-size: 1.4rem;
    color: var(--green); text-shadow: 0 0 10px var(--green);
}
.brand { font-family: var(--head); font-weight: 900; letter-spacing: 2px; font-size: 1rem; }
.nav-links { display: flex; gap: 6px; flex-wrap: wrap; }
.nav-links a {
    color: #888; text-decoration: none; font-size: 0.75rem;
    padding: 6px 12px; border-radius: 6px; letter-spacing: 1px;
    transition: 0.3s; border: 1px solid transparent;
}
.nav-links a:hover { color: var(--green); text-shadow: 0 0 8px var(--green); }
.nav-links a.active {
    color: var(--green); background: rgba(0,255,157,0.08);
    border: 1px solid var(--green); text-shadow: 0 0 8px var(--green);
}
.status-pill {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 14px; background: rgba(0,255,157,0.08);
    border: 1px solid var(--green); border-radius: 20px;
    font-size: 0.75rem; color: var(--green); font-weight: 700;
    letter-spacing: 1px;
}
.status-pill .dot {
    width: 8px; height: 8px; background: var(--green);
    border-radius: 50%; box-shadow: 0 0 10px var(--green);
    animation: blink 1.5s infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
.hero {
    display: grid; grid-template-columns: 1.5fr 1fr;
    gap: 40px; align-items: center;
    padding: 40px 30px; margin-bottom: 25px;
    background: rgba(10,0,21,0.6);
    border: 1px solid rgba(160,0,255,0.3); border-radius: 16px;
    backdrop-filter: blur(12px);
}
.pre-title { color: var(--green); font-size: 0.72rem; letter-spacing: 2px; margin-bottom: 12px; }
.greet { color: #888; font-size: 0.85rem; margin-bottom: 8px; }
.main-name {
    font-family: var(--head); font-weight: 900; font-size: 3.5rem;
    letter-spacing: 6px;
    background: linear-gradient(90deg, var(--neon), var(--neon2), var(--green));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 12px;
}
.subtitle { color: var(--cyan); font-size: 0.95rem; margin-bottom: 18px; }
.desc { color: #aaa; line-height: 1.7; font-size: 0.88rem; margin-bottom: 20px; }
.hero-handles { display: flex; flex-wrap: wrap; gap: 10px; }
.hero-handles a {
    text-decoration: none; color: var(--cyan);
    padding: 8px 16px; border: 1px solid rgba(0,229,255,0.4);
    border-radius: 20px; font-size: 0.82rem; transition: 0.3s;
}
.hero-handles a:hover { background: rgba(0,229,255,0.1); box-shadow: 0 0 15px rgba(0,229,255,0.5); }
.hero-handles a i { margin-right: 6px; }
.hero-right { display: flex; justify-content: center; }
.avatar-frame {
    position: relative; width: 220px; height: 220px;
    border: 2px solid var(--neon);
    box-shadow: 0 0 30px rgba(160,0,255,0.6);
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle, rgba(160,0,255,0.15), rgba(10,0,21,0.9));
}
.text-avatar {
    font-family: var(--head); font-weight: 900; font-size: 3rem;
    letter-spacing: 6px;
    background: linear-gradient(45deg, var(--green), var(--cyan), var(--neon2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.corner { position: absolute; width: 18px; height: 18px; border: 2px solid var(--green); }
.corner.tl { top: -2px; left: -2px; border-right: none; border-bottom: none; }
.corner.tr { top: -2px; right: -2px; border-left: none; border-bottom: none; }
.corner.bl { bottom: -2px; left: -2px; border-right: none; border-top: none; }
.corner.br { bottom: -2px; right: -2px; border-left: none; border-top: none; }
.stats-bar {
    display: grid; grid-template-columns: repeat(5, 1fr);
    gap: 1px; margin-bottom: 25px;
    background: rgba(160,0,255,0.2);
    border: 1px solid rgba(160,0,255,0.3);
    border-radius: 12px; overflow: hidden;
}
.stat { background: rgba(10,0,21,0.85); padding: 18px 12px; text-align: center; }
.stat-label { font-size: 0.68rem; color: #888; letter-spacing: 2px; margin-bottom: 8px; }
.stat-val { font-family: var(--head); font-weight: 700; font-size: 1.05rem; color: var(--green); }
.section {
    padding: 30px 25px; margin-bottom: 25px;
    background: rgba(10,0,21,0.6);
    border: 1px solid rgba(160,0,255,0.3); border-radius: 16px;
    backdrop-filter: blur(12px);
}
.sec-tag { color: var(--green); font-size: 0.72rem; letter-spacing: 2px; margin-bottom: 10px; }
.sec-title {
    font-family: var(--head); font-weight: 900; font-size: 1.6rem;
    letter-spacing: 3px; color: #fff; margin-bottom: 8px;
}
.sec-sub { color: #888; font-size: 0.82rem; margin-bottom: 22px; }
.bots-list { display: grid; gap: 12px; }
.bot-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 20px;
    background: rgba(160,0,255,0.05);
    border: 1px solid rgba(160,0,255,0.2);
    border-left: 3px solid var(--green);
    border-radius: 10px; text-decoration: none; color: #fff;
    transition: 0.3s; gap: 15px;
}
.bot-item:hover {
    background: rgba(160,0,255,0.15); transform: translateX(5px);
    box-shadow: 0 0 25px rgba(160,0,255,0.4);
    border-left-color: var(--neon2);
}
.bot-item.deactive { border-left-color: #ff3b3b; }
.bot-info { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.bot-name { font-weight: 700; font-size: 0.92rem; letter-spacing: 1px; }
.bot-user { color: var(--cyan); font-size: 0.75rem; }
.bot-cat {
    display: inline-block; padding: 2px 8px;
    background: rgba(0,229,255,0.1);
    border: 1px solid rgba(0,229,255,0.4);
    color: var(--cyan); font-size: 0.62rem;
    border-radius: 10px; letter-spacing: 1px;
    width: fit-content; margin-top: 4px;
}
.bot-desc { color: #888; font-size: 0.72rem; line-height: 1.4; margin-top: 4px; }
.bot-status {
    padding: 5px 12px; border-radius: 20px;
    font-size: 0.68rem; font-weight: 700; letter-spacing: 1px;
    flex-shrink: 0;
}
.bot-status.active {
    background: rgba(0,255,157,0.15); color: var(--green);
    border: 1px solid var(--green);
}
.bot-status.deactive {
    background: rgba(255,59,59,0.15); color: #ff3b3b;
    border: 1px solid #ff3b3b;
}
.communities-list {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 15px;
}
.community-card {
    display: block; text-decoration: none;
    padding: 20px; background: rgba(160,0,255,0.06);
    border: 1px solid rgba(160,0,255,0.3);
    border-radius: 12px; transition: 0.3s;
}
.community-card:hover {
    background: rgba(160,0,255,0.15); transform: translateY(-5px);
    box-shadow: 0 0 30px rgba(160,0,255,0.5);
    border-color: var(--green);
}
.community-type {
    display: inline-block; padding: 3px 10px;
    background: rgba(0,255,157,0.1);
    border: 1px solid var(--green);
    color: var(--green); font-size: 0.62rem;
    border-radius: 10px; letter-spacing: 1px; margin-bottom: 12px;
}
.community-name {
    font-family: var(--head); font-weight: 700;
    font-size: 1.1rem; color: #fff; margin-bottom: 10px;
}
.community-desc { color: #999; font-size: 0.8rem; line-height: 1.5; margin-bottom: 12px; }
.community-cta { color: var(--cyan); font-size: 0.78rem; letter-spacing: 1px; }
.about-card {
    background: rgba(160,0,255,0.06);
    border: 1px solid rgba(160,0,255,0.3);
    border-radius: 12px; padding: 25px; text-align: center;
}
.about-avatar {
    width: 90px; height: 90px; margin: 0 auto 18px;
    border: 2px solid var(--neon); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--head); font-weight: 900; font-size: 1rem;
    letter-spacing: 2px; color: var(--green);
    background: radial-gradient(circle, rgba(160,0,255,0.2), rgba(10,0,21,0.9));
}
.about-name {
    font-family: var(--head); font-size: 1.5rem; font-weight: 900;
    background: linear-gradient(90deg, var(--neon), var(--neon2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 6px; letter-spacing: 2px;
}
.about-role { color: var(--green); font-size: 0.75rem; letter-spacing: 2px; margin-bottom: 18px; }
.about-desc { color: #bbb; margin-bottom: 20px; line-height: 1.7; font-size: 0.88rem; }
.about-links { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.about-line { display: flex; gap: 10px; font-size: 0.85rem; flex-wrap: wrap; justify-content: center; }
.about-line span { color: #888; letter-spacing: 1px; }
.about-line a { color: var(--cyan); text-decoration: none; }
.contact-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 15px;
}
.contact-card {
    display: block; text-decoration: none; padding: 18px;
    background: rgba(160,0,255,0.06);
    border: 1px solid rgba(160,0,255,0.3);
    border-radius: 10px; transition: 0.3s;
}
.contact-card:hover {
    background: rgba(160,0,255,0.15); transform: translateY(-5px);
    box-shadow: 0 0 25px rgba(160,0,255,0.5);
    border-color: var(--green);
}
.c-label { color: #888; font-size: 0.68rem; letter-spacing: 2px; margin-bottom: 8px; }
.c-val { color: var(--cyan); font-weight: 700; font-size: 0.9rem; word-break: break-all; }
.terminal {
    background: #000; border: 1px solid var(--green);
    border-radius: 10px; overflow: hidden;
    box-shadow: 0 0 30px rgba(0,255,157,0.3);
}
.term-header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 15px; background: #0a0a0a;
    border-bottom: 1px solid rgba(0,255,157,0.3);
}
.term-header .dot { width: 12px; height: 12px; border-radius: 50%; }
.term-header .dot.r { background: #ff5f57; }
.term-header .dot.y { background: #febc2e; }
.term-header .dot.g { background: #28c840; }
.term-title { margin-left: auto; color: var(--green); font-size: 0.75rem; }
.term-body {
    padding: 18px; min-height: 180px; max-height: 320px;
    overflow-y: auto; font-size: 0.85rem; line-height: 1.6;
}
.term-out { color: var(--green); margin-bottom: 4px; }
.term-out .cyan { color: var(--cyan); }
.term-err { color: #ff5f57; }
.term-info { color: var(--cyan); }
.term-link { color: var(--cyan); text-decoration: underline; }
.term-input-line {
    display: flex; align-items: center;
    padding: 10px 18px; background: #050505;
    border-top: 1px solid rgba(0,255,157,0.2);
}
.prompt { color: var(--green); margin-right: 10px; font-size: 0.8rem; flex-shrink: 0; }
#termInput {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--cyan); font-family: var(--mono); font-size: 0.9rem;
    min-width: 0;
}
.footer {
    text-align: center; padding: 25px;
    color: #555; font-size: 0.72rem; letter-spacing: 1px;
}
@media (max-width: 800px) {
    .hero { grid-template-columns: 1fr; text-align: center; gap: 25px; padding: 25px 20px; }
    .hero-right { order: -1; }
    .hero-handles { justify-content: center; }
    .avatar-frame { width: 170px; height: 170px; }
    .text-avatar { font-size: 2.2rem; letter-spacing: 4px; }
    .main-name { font-size: 2.4rem; letter-spacing: 4px; }
    .stats-bar { grid-template-columns: repeat(2, 1fr); }
    .stats-bar .stat:last-child { grid-column: span 2; }
    .sec-title { font-size: 1.25rem; letter-spacing: 2px; }
    .nav-links a { font-size: 0.68rem; padding: 5px 8px; }
    .brand { font-size: 0.85rem; }
    .bot-item { flex-direction: column; align-items: flex-start; }
    .section { padding: 22px 16px; }
}
</style>
</head>

/* ============ TERMINAL ============ */
const termInput = document.getElementById('termInput');
const termBody = document.getElementById('termBody');
termInput.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const cmd = termInput.value.trim().toLowerCase();
    if (!cmd) return;
    const addLine = (text, cls='term-out') => {
        const p = document.createElement('p');
        p.className = cls; p.innerHTML = text;
        termBody.appendChild(p);
        termBody.scrollTop = termBody.scrollHeight;
    };
    addLine(`<span style="color:#00ff9d">${CONFIG.system.terminal}</span> ${cmd}`, 'term-info');
    termInput.value = '';
    if (cmd === 'help') addLine('Commands: bots, communities, sudo, insta, tg, stats, whoami, clear');
    else if (cmd === 'bots') {
        addLine(`Total: ${uniqueBots.length} | Active: ${activeCount} | Deactive: ${deactiveCount}`);
        uniqueBots.forEach((b, i) => addLine(`&nbsp;&nbsp;[${i+1}] <span class="cyan">${b.username}</span> — ${b.status.toUpperCase()}`));
    }
    else if (cmd === 'communities') CONFIG.communities.forEach((c, i) => addLine(`&nbsp;&nbsp;[${i+1}] <span class="cyan">${c.name}</span> — ${c.type}`));
    else if (cmd === 'sudo') addLine(`SUDO → <a href="${CONFIG.communities[0].url}" target="_blank" class="term-link">${CONFIG.communities[0].url}</a>`);
    else if (cmd === 'insta') addLine(`Instagram → <a href="${CONFIG.social.instagram.url}" target="_blank" class="term-link">${CONFIG.social.instagram.url}</a>`);
    else if (cmd === 'tg') addLine(`Telegram → <a href="${CONFIG.social.telegram.url}" target="_blank" class="term-link">${CONFIG.social.telegram.url}</a>`);
    else if (cmd === 'stats') addLine(`Total: ${uniqueBots.length} | Active: ${activeCount} | Deactive: ${deactiveCount}`);
    else if (cmd === 'whoami') addLine(`You are talking to ${CONFIG.profile.name} — ${CONFIG.profile.username}`);
    else if (cmd === 'clear') termBody.innerHTML = '';
    else addLine(`Command not found: ${cmd}. Type <span class="cyan">help</span>.`, 'term-err');
});

/* ============ MATRIX RAIN ============ */
const canvas = document.getElementById('matrix-canvas');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
resize();
addEventListener('resize', resize);
const chars = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎ0123456789ABCDEF';
const fontSize = 14;
let columns = Math.floor(canvas.width / fontSize);
let drops = Array(columns).fill(1);
addEventListener('resize', () => {
    columns = Math.floor(canvas.width / fontSize);
    drops = Array(columns).fill(1);
});
setInterval(() => {
    ctx.fillStyle = 'rgba(5, 0, 10, 0.08)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00ff9d';
    ctx.font = fontSize + 'px monospace';
    for (let i = 0; i < drops.length; i++) {
        const t = chars.charAt(Math.floor(Math.random() * chars.length));
        ctx.fillText(t, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
    }
}, 50);
</script>
